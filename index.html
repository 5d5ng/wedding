<head>

<meta property="og:title" content="오동의 🩵 최예원 결혼합니다">
<meta property="og:description" content="2027년 2월 21일 일요일 오후 3시 30분 · 라마다서울신도림호텔">

<style>
/* Layout: 430px card on a bright sky-blue backdrop, mirroring the reference flow:
   photo cover → sky date band → greeting → full photo → family/profiles → day → location → info cards → gallery → accounts → thanks → share. */
:root{
  --backdrop:#DCEEFA; --backdrop2:#EEF7FD;
  --bg:#FFFFFF; --pale:#F3F8FC; --pale2:#E6F1F9;
  --sky:#8DBDDF; --sky-deep:#5F95BF; --navy:#2E4A63;
  --ink:#2F3A44; --sub:#6B7A86; --line:#DCE8F1; --rose:#E8A3A8;
  --kakao:#FEE500;
  --script:'Allura',cursive; --serif-en:'Cormorant Garamond',serif; --serif:'Noto Serif KR',serif; --sans:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 700px at 15% 0%,#FFFFFF 0%,rgba(255,255,255,0) 60%),radial-gradient(900px 600px at 90% 100%,#FDF3EE 0%,rgba(253,243,238,0) 60%),linear-gradient(180deg,var(--backdrop),var(--backdrop2));background-attachment:fixed;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
img{display:block;max-width:100%}
[hidden]{display:none!important}
.app{max-width:430px;margin:0 auto;background:var(--bg);overflow:hidden;box-shadow:0 10px 50px rgba(70,120,160,.14)}
@media (min-width:600px){.app{margin:28px auto 40px;border-radius:24px}}
.sec{padding-block:72px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));text-align:center}
.pale{background:var(--pale)}
.h-en{font-family:var(--serif-en);font-weight:300;font-size:30px;letter-spacing:.12em;color:var(--navy);margin:0}
.lead{margin:10px 0 0;font-size:13px;color:var(--sub)}
.pre{white-space:pre-line}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a,button{color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--sky-deep);outline-offset:2px}
.fade{transition:opacity 1s ease,transform 1s ease}
.fade.pre-in{opacity:.001;transform:translateY(20px)}
@media (prefers-reduced-motion:reduce){.fade{transition:none}.fade.pre-in{opacity:1;transform:none}}

/* cover */
.cover{position:relative;height:100vh;height:100svh;max-height:820px;min-height:600px;overflow:hidden;background:var(--pale2)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(20,40,60,.30) 0%,rgba(20,40,60,0) 30%,rgba(20,40,60,0) 80%,rgba(20,40,60,.18) 100%)}
.cover .head{position:absolute;z-index:2;left:0;right:0;top:calc(44px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.3);padding:0 20px;text-align:center}
.cover .cdate{font-size:15px;letter-spacing:.32em}
.cover .script{font-family:var(--script);font-size:60px;line-height:1.05}
.cover .cnames{font-family:var(--serif);font-size:18px;letter-spacing:.14em}
.cover .scroll{position:absolute;z-index:2;bottom:20px;left:50%;transform:translateX(-50%);opacity:.85}
.cover canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* date band */
.band{background:linear-gradient(180deg,var(--sky) 0%,#A9CEE8 100%);color:#fff;padding-block:84px 90px}
.band .names{font-family:var(--serif);font-size:22px;letter-spacing:.14em}
.band .invite{margin-top:8px;font-size:14px;opacity:.95}
.band .date{margin-top:44px;font-family:var(--serif-en);font-weight:300;font-size:30px;line-height:1.55;letter-spacing:.04em}
.band .date span{display:inline-block;opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease}
.band .date.on span{opacity:1;transform:none}

/* greeting */
.heart-icon{display:block;margin:0 auto 26px}
.quote{font-size:14px;color:var(--sub);margin:0 0 34px}
.greet{font-family:var(--serif);font-size:15.5px;line-height:2;margin:0}
.sign{margin-top:36px;font-size:14px;color:var(--ink)}
.full-photo{width:100%;aspect-ratio:4/5;object-fit:cover}

/* family */
.family{display:grid;grid-template-columns:auto auto auto;justify-content:center;align-items:baseline;column-gap:8px;row-gap:14px;font-size:15px;text-align:left}
.family .row{display:contents}
.family .p{color:var(--sub)}
.family b{font-weight:500;font-size:17px;color:var(--navy);margin-left:4px;text-align:right}
.btn-wide{margin-top:30px;width:100%;height:50px;border:none;border-radius:12px;background:var(--sky);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.profiles{margin-top:56px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;text-align:center}
.prof img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px}
.prof .role{margin-top:12px;font-family:var(--serif-en);font-size:13px;letter-spacing:.2em;color:var(--sky-deep)}
.prof .nm{font-family:var(--serif);font-size:18px}
.prof .tags{margin-top:6px;font-size:11.5px;color:var(--sub);line-height:1.6}
.prof p{margin:8px 0 0;font-size:12.5px;line-height:1.7;color:var(--sub)}

/* day */
.cal{margin:28px auto 0;max-width:300px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:6px;font-variant-numeric:tabular-nums;font-size:14px}
.cal .h{font-size:12px;color:var(--sub);padding-bottom:6px}
.cal .d{height:34px;display:flex;align-items:center;justify-content:center}
.cal .sun{color:#D05C6A}
.cal .on span{width:34px;height:34px;border-radius:17px;background:var(--sky);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.count{margin-top:26px;display:flex;gap:8px;justify-content:center}
.count div{width:62px;padding:10px 0;background:var(--pale);border-radius:10px;display:flex;flex-direction:column;align-items:center;font-variant-numeric:tabular-nums}
.count b{font-family:var(--serif-en);font-size:24px;font-weight:500;color:var(--navy)}
.count small{font-size:10px;letter-spacing:.14em;color:var(--sub)}
.dday{margin-top:18px;font-size:14px}
.dday b{color:var(--sky-deep)}
.calsave{margin-top:22px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.calsave a:first-child,.calsave button{grid-column:1/-1}
.calsave a,.calsave button{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:13px;text-decoration:none;display:flex;align-items:center;justify-content:center}

/* location */
.venue{margin-top:20px;font-size:15px;font-weight:500}
.addr{margin-top:4px;font-size:13px;color:var(--sub);display:inline-flex;align-items:center;gap:6px;background:none;border:none;padding:4px}
.map{margin-top:22px;width:100%;aspect-ratio:16/11;border:0;border-radius:12px;background:var(--pale2)}
.maps{margin-top:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.maps a{height:46px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13.5px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}
.route{margin-top:34px;text-align:left;border-top:1px solid var(--line)}
.route .item{padding:20px 2px;border-bottom:1px solid var(--line)}
.route .t{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sky-deep);font-weight:500}
.route .x{margin-top:8px;font-size:13.5px;line-height:1.75;white-space:pre-line;color:var(--ink)}

/* info cards */
.info-sec{background:linear-gradient(180deg,#DCECF7,#EAF4FB)}
.cards{margin-top:34px;position:relative;overflow:hidden}
.track{display:flex;transition:transform .45s ease}
.card{flex:0 0 100%;padding:0 4px}
.card .in{background:#fff;border-radius:16px;padding:30px 24px;text-align:left;box-shadow:0 6px 20px rgba(70,120,160,.08);min-height:240px}
.card h3{margin:0 0 16px;text-align:center;font-family:var(--serif);font-weight:500;font-size:16px;color:var(--sky-deep)}
.card p{margin:0;font-size:13.5px;line-height:1.85;white-space:pre-line}
.pager{margin-top:16px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub)}
.pager button{width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center}

/* gallery */
.grid{margin-top:28px;margin-inline:calc(-1 * max(28px,env(safe-area-inset-left,0px)));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
.grid button{border:none;padding:0;aspect-ratio:1;background:var(--pale2);overflow:hidden}
.grid img{width:100%;height:100%;object-fit:cover}
.more{margin-top:18px;border:none;background:none;font-size:13px;color:var(--sub);display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-height:44px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(15,25,35,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb img{max-width:94vw;max-height:76vh;object-fit:contain}
.lb .ctrl{display:flex;gap:28px;align-items:center;color:#fff;font-variant-numeric:tabular-nums;font-size:14px}
.lb .ctrl button,.lb .x{width:44px;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;display:flex;align-items:center;justify-content:center}
.lb .x{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}

/* accounts */
.acc{margin-top:28px;display:flex;flex-direction:column;gap:10px;text-align:left}
.acc details{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(70,120,160,.07)}
.acc summary{list-style:none;min-height:54px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;font-size:14px;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc details[open] summary svg{transform:rotate(180deg)}
.acc .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);font-size:14px}
.acc .row small{display:block;color:var(--sub);font-size:12px}
.mini{height:32px;padding:0 14px;border:1px solid var(--line);border-radius:16px;background:var(--bg);font-size:12.5px}

/* thanks + share */
.thanks{background:var(--sky-deep);color:#fff;padding-block:48px;font-size:13.5px;line-height:1.9;white-space:pre-line}
.share{padding:28px max(24px,env(safe-area-inset-left,0px)) 12px;display:flex;flex-direction:column;gap:10px}
.share button{height:50px;border:none;border-radius:12px;font-size:14px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.share .k{background:var(--kakao);color:#191919}
.share .l{background:var(--sky);color:#fff}
.foot{text-align:center;padding:28px 0 calc(40px + env(safe-area-inset-bottom,0px));font-family:var(--script);font-size:26px;color:var(--sky-deep)}

.sheet{position:fixed;inset:0;z-index:60;background:rgba(20,35,50,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{width:100%;max-width:430px;background:#fff;border-radius:18px 18px 0 0;padding:26px 24px calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px}
.sheet h3{margin:0 0 10px;font-family:var(--serif);font-weight:500;font-size:17px;text-align:center}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.crow small{display:block;color:var(--sub);font-size:12px}
.crow a{height:36px;min-width:52px;padding:0 12px;border:1px solid var(--line);border-radius:18px;text-decoration:none;font-size:13px;display:flex;align-items:center;justify-content:center}
.ghost{height:44px;border:none;background:none;color:var(--sub);font-size:14px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:rgba(30,45,60,.92);color:#fff;font-size:13.5px;padding:12px 18px;border-radius:24px;white-space:nowrap}
</style>
</head>
<body>
<div class="app">

  <section class="cover" aria-label="메인">
    <img id="coverImg" alt="동의와 예원의 웨딩 사진">
    <canvas id="petals" aria-hidden="true"></canvas>
    <div class="head">
      <div class="cdate" id="coverDate"></div>
      <div class="script" id="coverScript"></div>
      <div class="cnames" id="coverNames"></div>
    </div>
    <svg class="scroll" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M6 9l6 6 6-6"/></svg>
  </section>

  <section class="sec band" aria-label="예식 일시">
    <div class="names" id="names"></div>
    <div class="invite" id="inviteLine"></div>
    <div class="date" id="dateEn" aria-label=""></div>
  </section>

  <section class="sec fade" aria-label="인사말">
    <svg class="heart-icon" width="34" height="30" viewBox="0 0 34 30" fill="none" stroke="var(--sky-deep)" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M17 27C8 21 2 15.5 2 9.5 2 5.4 5.2 2.5 9 2.5c3.3 0 5.8 2 8 5 2.2-3 4.7-5 8-5 3.8 0 7 2.9 7 7 0 6-6 11.5-15 17.5z"/><path d="M14 9c1.5-.8 3.2-.6 4.5.6" opacity=".6"/></svg>
    <p class="quote pre" id="quote" hidden></p>
    <p class="greet pre" id="greeting"></p>
    <div class="sign" id="sign"></div>
  </section>

  <img class="full-photo fade" id="midPhoto" alt="동의와 예원의 웨딩 사진" loading="lazy">

  <section class="sec pale fade" aria-label="혼주 및 신랑신부 소개">
    <div class="family">
      <div class="row"><span class="p" id="gParents"></span><span>의 <span id="gRel"></span></span><b id="gName"></b></div>
      <div class="row"><span class="p" id="bParents"></span><span>의 <span id="bRel"></span></span><b id="bName"></b></div>
    </div>
    <button class="btn-wide" id="contactBtn" hidden><span>축하 연락하기</span><span aria-hidden="true">→</span></button>
    <div class="profiles" id="profiles"></div>
  </section>

  <section class="sec fade" aria-labelledby="dayH">
    <h2 class="h-en" id="dayH">WEDDING DAY</h2>
    <p class="lead" id="dateKo"></p>
    <div class="cal" id="cal"></div>
    <div class="count">
      <div><b id="cD">0</b><small>DAYS</small></div>
      <div><b id="cH">00</b><small>HOUR</small></div>
      <div><b id="cM">00</b><small>MIN</small></div>
      <div><b id="cS">00</b><small>SEC</small></div>
    </div>
    <div class="dday"><span id="ddNames"></span>의 결혼식이 <b id="dd"></b> 남았습니다</div>
    <div class="calsave">
      <a id="gcal" target="_blank" rel="noopener">구글 캘린더 저장</a>
      <a id="acal" href="wedding.ics">아이폰 캘린더 저장</a>
      <a id="scal" href="wedding.ics">갤럭시 캘린더 저장</a>
      <button id="ccopy">일정 복사</button>
    </div>
  </section>

  <section class="sec pale fade" aria-labelledby="locH">
    <h2 class="h-en" id="locH">LOCATION</h2>
    <div class="venue"><span id="venue"></span> <span id="hall"></span></div>
    <button class="addr" id="copyAddr"><span id="addrText"></span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>
      <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">주소 복사</span>
    </button>
    <iframe class="map" id="map" title="예식장 지도" loading="lazy"></iframe>
    <div class="maps">
      <a id="naverMap" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5" fill="#03C75A"/><path d="M7 7h3.2l3.6 5.3V7H17v10h-3.2L10.2 11.7V17H7z" fill="#fff"/></svg>네이버 지도</a>
      <a id="kakaoMap" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5" fill="#FEE500"/><path d="M12 5.5c-3.9 0-7 2.5-7 5.6 0 2 1.3 3.7 3.3 4.7l-.7 2.6 3-2c.5.1.9.1 1.4.1 3.9 0 7-2.5 7-5.6S15.9 5.5 12 5.5z" fill="#191919"/></svg>카카오맵</a>
    </div>
    <div class="route" id="route"></div>
  </section>

  <section class="sec info-sec fade" aria-labelledby="infoH" id="infoSec">
    <h2 class="h-en" id="infoH">INFORMATION</h2>
    <div class="cards"><div class="track" id="track"></div></div>
    <div class="pager">
      <button id="prevCard" aria-label="이전 안내"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span id="cardNum"></span>
      <button id="nextCard" aria-label="다음 안내"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </section>

  <section class="sec fade" aria-labelledby="galH">
    <h2 class="h-en" id="galH">GALLERY</h2>
    <p class="lead">사진을 누르시면 크게 보실 수 있습니다</p>
    <div class="grid" id="grid"></div>
    <button class="more" id="moreBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>더 보기</button>
  </section>

  <section class="sec pale fade" aria-labelledby="rsvpH" id="rsvpSec" hidden>
    <h2 class="h-en" id="rsvpH">R.S.V.P</h2>
    <p class="lead">모든 분들을 소중히 모실 수 있도록 참석 의사를 전해주세요</p>
    <a class="btn-wide" id="rsvpLink" target="_blank" rel="noopener" style="text-decoration:none"><span>참석 의사 체크하기</span><span aria-hidden="true">→</span></a>
  </section>

  <section class="sec pale fade" aria-labelledby="accH">
    <div style="width:40px;height:1px;background:var(--ink);opacity:.4;margin:0 auto 22px"></div>
    <h2 id="accH" style="margin:0;font-family:var(--serif);font-weight:500;font-size:17px">마음 전하실 곳</h2>
    <p class="lead">참석이 어려우신 분들을 위해 기재했습니다<br>너그러운 마음으로 양해 부탁드립니다</p>
    <div class="acc" id="acc"></div>
  </section>

  <img class="full-photo fade" id="endPhoto" alt="동의와 예원의 웨딩 사진" loading="lazy">

  <div class="sec thanks" id="thanks"></div>

  <div class="share">
    <button class="k" id="kakaoBtn"><span>카카오톡으로 청첩장 전하기</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></button>
    <button class="l" id="copyLink"><span>청첩장 주소 복사하기</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button>
  </div>
  <div class="foot">Dong-eui &amp; Ye-won</div>
</div>

<div class="sheet" id="contact" hidden role="dialog" aria-modal="true" aria-labelledby="ct">

</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <button class="x" data-close aria-label="닫기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

  <div class="ctrl">

    <span id="lbNum"></span>
    <button id="lbNext" aria-label="다음 사진"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
